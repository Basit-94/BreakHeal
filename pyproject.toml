[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "breakheal"
version = "0.1.0"
description = "Adversarial PR edge-case breaker and self-healing test prover"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "openai>=1.30.0",
    "pytest>=8.2.0"
]

[project.scripts]
breakheal = "breakheal.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["breakheal*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "demo_repo"]
