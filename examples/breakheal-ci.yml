name: BreakHeal PR Shield

on:
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  breakheal-verify:
    name: BreakHeal Red-to-Green Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install BreakHeal
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run BreakHeal PR Audit
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          breakheal pr --base origin/${{ github.base_ref }} --yes

      - name: Upload Verification Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: breakheal-audit-report
          path: BREAKHEAL_REPORT.md
